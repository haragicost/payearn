<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.header{
  background:linear-gradient(90deg,#7b2ff7,#f107a3);
  padding:15px;
  display:flex;
  justify-content:space-between;
}
.card{
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:12px;
}
input,button,select{
  padding:10px;margin:5px;border:none;border-radius:6px;
}
button{cursor:pointer;}
.green{background:#2ecc71;color:black;}
.red{background:#e74c3c;color:white;}
.yellow{background:#f1c40f;color:black;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #444;padding:8px;text-align:center;}
.section{display:none;}
.active{display:block;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="header">
<h3>ADMIN PANEL</h3>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<button onclick="show('users')">Users</button>
<button onclick="show('withdraw')">Withdraw</button>
</div>

<!-- USERS -->
<div id="users" class="section active">
<h3>All Users</h3>
<table id="userTable">
<tr>
<th>Username</th>
<th>Status</th>
<th>Balance</th>
<th>Action</th>
</tr>
</table>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="section">
<h3>Withdraw Requests</h3>
<table id="withTable">
<tr>
<th>User</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>
</div>

</div>

<script>

// ADMIN LOGIN
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="1234"){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";
loadUsers();
loadWithdraw();
}else{
alert("Wrong Admin Login");
}
}

// LOGOUT
function logout(){
location.reload();
}

// SHOW SECTION
function show(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// LOAD USERS
function loadUsers(){
let table=document.getElementById("userTable");
table.innerHTML="<tr><th>Username</th><th>Status</th><th>Balance</th><th>Action</th></tr>";

let users=JSON.parse(localStorage.getItem("allUsers"))||[];

users.forEach(u=>{
let data=JSON.parse(localStorage.getItem(u.username))||{refBal:0};

let active=localStorage.getItem(u.username+"_active");

let status=(active==="true")?"ACTIVE":"INACTIVE";

let row=table.insertRow();
row.insertCell(0).innerText=u.username;
row.insertCell(1).innerText=status;
row.insertCell(2).innerText=data.refBal||0;

let btn=document.createElement("button");

if(status==="ACTIVE"){
btn.innerText="Deactivate";
btn.className="red";
btn.onclick=function(){
localStorage.setItem(u.username+"_active","false");
loadUsers();
};
}else{
btn.innerText="Activate";
btn.className="green";
btn.onclick=function(){
localStorage.setItem(u.username+"_active","true");
loadUsers();
};
}

row.insertCell(3).appendChild(btn);
});
}

// LOAD WITHDRAW
function loadWithdraw(){
let table=document.getElementById("withTable");
table.innerHTML="<tr><th>User</th><th>Amount</th><th>Status</th><th>Action</th></tr>";

let reqs=JSON.parse(localStorage.getItem("withdraws"))||[];

reqs.forEach((w,i)=>{
let row=table.insertRow();
row.insertCell(0).innerText=w.user;
row.insertCell(1).innerText=w.amount;
row.insertCell(2).innerText=w.status;

let btn=document.createElement("button");
btn.innerText="Approve";
btn.className="yellow";

btn.onclick=function(){
w.status="Approved";
localStorage.setItem("withdraws",JSON.stringify(reqs));
loadWithdraw();
};

row.insertCell(3).appendChild(btn);
});
}

</script>

</body>
</html>
